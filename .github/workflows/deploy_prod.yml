name: 🚀 Deploy Production

on:
  push:
    branches: [ master ]

env:
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}

jobs:
  checkout-and-setup:
    name: 🔧 Checkout and Setup
    runs-on: ubuntu-latest
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1

      - name: Set up JDK and Maven
        id: setup
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '22'
          distribution: 'corretto'

  install-test-and-build:
    name: 🌱 Install, Test and Build
    runs-on: ubuntu-latest
    needs: checkout-and-setup
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK and Maven
        id: setup
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '22'
          distribution: 'corretto'

      - name: ⬇️ Install dependencies
        run: |
          mvn -X clean install

      - name: 📂 Test with Maven
        run: |
          mvn test

      - name: 📂 Build with Maven
        run: |
          mvn -B package --file pom.xml -DskipTests

  docker-login:
    name: 🐳 Docker Login
    runs-on: ubuntu-latest
    needs: install-test-and-build
    steps:
      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

  build-and-push-docker:
    name: 🚀 Build & Push Docker Image
    runs-on: ubuntu-latest
    environment:
      name: Production
    needs: [ install-test-and-build, docker-login ]
    permissions:
      contents: read
      packages: write
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      image_name: ${{ steps.meta.outputs.image_name }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK and Maven
        id: setup
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '22'
          distribution: 'corretto'

      - name: 📝 Set Release Metadata
        id: meta
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_NAME="v${VERSION}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          
          echo "release_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      #- name: create-json
      #  uses: jsdaniell/create-json@v1.2.3
      #  with:
      #    name: "credentials.json"
      #    json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      #    dir: "src/main/resources/"


      - name: 🚀 Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v7.0
        with:
          image: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPOSITORY }}
          #tags: latest
          tags: ${{ env.RELEASE_VERSION }}, latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          multiPlatform: true
          platform: linux/amd64,linux/arm64
          #platform: linux/arm64


  create-release:
    name: 🏷️ Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    permissions:
      contents: write
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 📝 Generate Release Changelog
        id: changelog
        env:
          TAG_NAME: ${{ needs.build-and-push-docker.outputs.tag_name }}
          VERSION: ${{ needs.build-and-push-docker.outputs.release_version }}
          IMAGE_NAME: ${{ needs.build-and-push-docker.outputs.image_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 20 --oneline --no-merges --pretty=format:"* %s (%h)")
          fi

          cat <<EOF > release_notes.md
          # Material Home Assistant ${TAG_NAME}

          Nuova versione di **Material Home Assistant** compilata e distribuita con successo su GitHub Container Registry.

          ### 📦 Dettagli Rilascio
          - **Versione:** \`${VERSION}\`
          - **Tag:** \`${TAG_NAME}\`
          - **Immagine Docker:** \`${IMAGE_NAME}:${VERSION}\`

          ### 🛠️ Modifiche incluse
          ${COMMITS}
          EOF

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          name: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}