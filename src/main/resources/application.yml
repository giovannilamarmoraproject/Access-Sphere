env: Local
sensitiveData: password|token|Authorization|Bearer|Basic|access[_-]?token|refresh[_-]?token|jwt|jwtSecret|jweSecret|registrationToken|secretKey|tokenReset

server:
  port: 8081
cookie-domain: localhost
spring:
  main:
    allow-circular-references: true
  thymeleaf:
    prefix: classpath:/static/
  application:
    name: access-sphere
    starter-log: true # Show Started Application
  r2dbc:
    url: r2dbc:mysql://localhost:3306/access_sphere
    username: root
    password: root
    initialization: always
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/access_sphere
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    generate-ddl: true
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  codec:
    max-in-memory-size: 20MB # Upload of images

# Level of LOG
logging:
  config: ${LOGBACK_FILE:}
  level:
    io.github.giovannilamarmora: DEBUG
    web: INFO
    root: INFO
    org:
      springframework:
        web: INFO
      hibernate: ERROR

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

filter:
  requestResponse:
    enabled: true
    shouldNotFilter: "*swagger*,*api-docs*,*webjars*,*/,/cookie-policy,/privacy-policy,/docs,*/docs,*/docs/*,*/docs/**,*/favicon.ico,/app,*/app,*/app/*,*/app/**,*/img/*,*/js/*,*/css/*,/manifest.json,/service-worker.js,/robots.txt,/sitemap.xml,*/v1/app/settings"
    #shouldNotFilter: "**/swagger-ui/**,/api-docs,**/api-docs/**,*/,*.css,*.js,*/img/*,*/favicon.ico,/login,/login/*,/cookie-policy,/privacy-policy"
  rate-limiting:
    shouldFilter: "*/users/change/password,*/users/change/password/request,**/v1/users/change/**,*/users/password/**,**/v1/users/password/**"
  session-id:
    shouldNotFilter: "*swagger*,*api-docs*,*webjars*,**/actuator,**/actuator/**,*/,/cookie-policy,/privacy-policy,/docs,*/docs,*/docs/*,*/docs/**,*/favicon.ico,/app,*/app,*/app/*,*/app/**,*/img/*,*/js/*,*/css/*,/manifest.json,/service-worker.js,/robots.txt,/sitemap.xml,*/v1/app/settings"
    #shouldNotFilter: "**/swagger-ui/**,/api-docs,**/api-docs/**,*/,*.css,*.js,*/img/*,*/favicon.ico,/login,*/login/*,/cookie-policy,/privacy-policy"
    generateSessionURI: "*/v1/oAuth/2.0/authorize,*/v1/oauth2/authorize,*/users/register,*/v1/users,**/v1/users/change/**,**/v1/users/password/**"
    bearerNotFilter: "*/v1/oAuth/2.0/login/*,*/v1/oauth2/login/*,*/users/register,*/v1/users,*/v1/users/change/password/*,*/v1/users/change/password,*/v1/users/password/*,*/v1/mfa/verify,*/favicon.ico,*/v1/app/settings"
    logoutURI: "*/v1/oAuth/2.0/logout"
  authorization:
    shouldFilter: "*/v1/oAuth/2.0/token/exchange,*/v1/oauth2/token/exchange,**/v1/users/profile"

rest:
  client:
    email-sender:
      baseUrl: https://email-sender.giovannilamarmora.com
      path:
        sendEmailUrl: /v1/send-email

app:
  version: @project.version@
  domain: ${APP_DOMAIN:localhost:8081}
  aes-key: ${AES_KEY:}
  tech-user:
    username: ${TECH_USERNAME:tech_admin}
    password: ${TECH_PASSWORD:tech_password}
    client-id: ${TECH_CLIENT_ID:ACCESS-SPHERE-TECH}
    email: ${TECH_EMAIL:admin@accesssphere.local}
    jwt-secret: ${TECH_JWT_SECRET:}
  exception:
    stacktrace: true # Active StackTrace in Response
  cors:
    enabled: true
    shouldNotFilter: "*swagger*,*api-docs*,*webjars*"
    allowedOrigins: "*"
    allowedHeaders: Origin, Content-Type, Accept, Authorization, Location, Trace-ID, Span-ID, Parent-ID, Registration-Token, Session-ID, Redirect-Uri
    allowCredentials: true