env: ${APPLICATION_ENVIRONMENT:Deploy} # Used for Google Cloud LOG
server:
  port: 8080
cookie-domain: ${COOKIE_DOMAIN:} # Used for Cookie
spring:
  main:
    allow-circular-references: true
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_JDBC_URL}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    generate-ddl: true
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  codec:
    max-in-memory-size: ${CODEC_MAX_IN_MEMORY_SIZE:20MB}
  mail:
    host: ${SERVER_SMTP_HOST:smtp.gmail.com}
    port: ${SERVER_SMTP_PORT:587}
    username: ${SERVER_USERNAME}
    password: ${SERVER_PASSWORD_TOKEN}
    sender-emails: ${SENDER_EMAILS:${SERVER_EMAIL:admin@access-sphere.com}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Level of LOG
logging:
  level:
    io.github.giovannilamarmora: ${LOGGING_LEVEL}

app:
  version: @project.version@
  domain: ${APP_DOMAIN:access-sphere.giovannilamarmora.com}
  exception:
    stacktrace: ${SHOW_EXCEPTION_STACKTRACE:false} # Active StackTrace in Response
  cors:
    enabled: ${CORS_ENABLED}
    shouldNotFilter: ${CORS_NOT_FILTER:*swagger*,*api-docs*,*webjars*}
    allowedOrigins: ${CORS_ALLOWED_ORIGINS}
    allowedHeaders: ${CORS_ALLOWED_HEADERS}
    allowCredentials: ${CORS_ALLOW_CREDENTIALS}
  admin-user:
    username: ${ADMIN_USERNAME:tech_admin}
    password: ${ADMIN_PASSWORD:tech_password}
    client-id: ACCESS-SPHERE-AUTH
    email: ${ADMIN_EMAIL:admin@accesssphere.local}
    jwt-secret: ${ADMIN_JWT_SECRET:}