<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Sphere - Dettagli Utente</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,ROND@6..144,-10..0,25..151,1..1000,100&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/img/logo-minimal.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/app/shared/sweetalert.css" />
  <script src="/app/shared/sweetalert.js"></script>

  <!-- Core Scripts -->
  <script src="/app/shared/config.js"></script>
  <script src="/app/shared/utils.js"></script>
  <script src="/app/shared/api/authorize.js"></script>
  <script src="/app/shared/api/logout.js"></script>
  <script src="/app/i18n/translations.js"></script>
  <script src="/app/shared/api/rest.js"></script>
  <script src="/app/user/js/delete.js"></script>
  <script src="/app/user/js/otp.js"></script>
  <script src="/app/user/js/user.js?v=2.0.3"></script>

  <!-- Unified M3 Dashboard Theme -->
  <link rel="stylesheet" href="/css/m3-dashboard.css?v=2.0.2" />
</head>
<body>

  <!-- Wide Unified Header -->
  <header class="glass-header">
    <div class="header-container">
      
      <div class="flex items-center gap-6">
        <a href="/app" class="flex items-center gap-3 text-decoration-none group">
          <img src="/img/logo-minimal.svg" alt="Access Sphere Logo" class="w-10 h-10 transition-transform duration-300 group-hover:scale-110" />
          <div class="flex flex-col">
            <span class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
              Access Sphere
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 font-mono border border-purple-500/30">Console</span>
            </span>
            <span class="text-[11px] text-gray-400 font-medium">Dettagli Profilo Utente</span>
          </div>
        </a>

        <nav class="hidden md:flex items-center gap-2 border-l border-purple-500/20 pl-6">
          <a href="/app" class="nav-tab-m3 text-decoration-none">
            <i class="fa-solid fa-gauge-high"></i> Panoramica
          </a>
          <a href="/app/users" class="nav-tab-m3 active text-decoration-none">
            <i class="fa-solid fa-users"></i> Utenti
          </a>
          <a href="/app/clients" class="nav-tab-m3 text-decoration-none">
            <i class="fa-solid fa-key"></i> Client OAuth2
          </a>
          <a href="https://github.com/giovannilamarmora/Access-Sphere" target="_blank" class="nav-tab-m3 text-decoration-none">
            <i class="fa-solid fa-book"></i> API Docs
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-2">
        <a href="/app/users" class="m3-icon-btn" title="Torna all'elenco Utenti">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <button onclick="getVersion()" class="m3-icon-btn" title="Info Versione">
          <i class="fa-solid fa-circle-info text-sm"></i>
        </button>
        <button onclick="logout()" class="m3-icon-btn m3-icon-btn-danger ml-2" title="Logout">
          <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
        </button>
      </div>

    </div>
  </header>

  <main class="dashboard-wide-container">
    <div id="user-data" class="w-full">
      <!-- Populated dynamically by user.js displayUserData -->
      <div class="m3-card p-12 text-center text-purple-300 flex flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
        <p class="text-sm">Caricamento scheda utente in corso...</p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      getUser();
    });
  </script>

</body>
</html>
