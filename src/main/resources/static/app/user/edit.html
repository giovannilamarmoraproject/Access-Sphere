<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Sphere - Modifica Utente</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,ROND@6..144,-10..0,25..151,1..1000,100&display=swap" rel="stylesheet">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/img/logo-minimal.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/app/shared/sweetalert.css" />
  <script src="/app/shared/sweetalert.js"></script>

  <!-- Core Scripts -->
  <script src="/app/shared/config.js"></script>
  <script src="/app/shared/utils.js"></script>
  <script src="/app/shared/api/authorize.js"></script>
  <script src="/app/shared/api/logout.js"></script>
  <script src="/app/i18n/translations.js"></script>
  <script src="/app/shared/api/rest.js"></script>
  <script src="/app/user/js/validationForm.js"></script>
  <script src="/app/user/js/edit.js"></script>

  <!-- Unified M3 Dashboard Theme -->
  <link rel="stylesheet" href="/css/m3-dashboard.css" />
</head>
<body>

  <!-- Wide Unified Header -->
  <header class="glass-header">
    <div class="header-container">
      <div class="flex items-center gap-6">
        <a href="/app" class="flex items-center gap-3 text-decoration-none group">
          <img src="/img/logo-minimal.svg" alt="Access Sphere Logo" class="w-10 h-10 transition-transform duration-300 group-hover:scale-110" />
          <div class="flex flex-col">
            <span class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
              Access Sphere
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 font-mono border border-purple-500/30">Console</span>
            </span>
            <span class="form-helper text-purple-300 text-xs font-medium">Modifica Profilo Utente</span>
          </div>
        </a>

        <nav class="hidden md:flex items-center gap-2 border-l border-purple-500/20 pl-6">
          <a href="/app" class="nav-tab-m3 text-decoration-none">
            <i class="fa-solid fa-gauge-high"></i> Panoramica
          </a>
          <a href="/app/users" class="nav-tab-m3 active text-decoration-none">
            <i class="fa-solid fa-users"></i> Utenti
          </a>
          <a href="/app/clients" class="nav-tab-m3 text-decoration-none">
            <i class="fa-solid fa-key"></i> Client OAuth2
          </a>
          <a href="https://github.com/giovannilamarmora/Access-Sphere" target="_blank" class="nav-tab-m3 text-decoration-none">
            <i class="fa-solid fa-book"></i> API Docs
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-2">
        <a href="/app/users" class="m3-icon-btn" title="Torna agli Utenti">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <button onclick="getVersion()" class="m3-icon-btn" title="Info Versione">
          <i class="fa-solid fa-circle-info text-sm"></i>
        </button>
        <button onclick="logout()" class="m3-icon-btn m3-icon-btn-danger ml-2" title="Logout">
          <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Edit User Container -->
  <main class="dashboard-wide-container">
    <div class="m3-card p-8 sm:p-12">
      
      <div class="flex items-center justify-between pb-6 mb-8 border-b border-purple-500/15">
        <div>
          <h2 class="text-2xl sm:text-3xl font-bold text-white flex items-center gap-3">
            <i class="fa-solid fa-user-pen text-purple-400"></i> Modifica Utente
          </h2>
          <p class="form-helper text-purple-300 text-xs mt-1">
            Aggiorna i dati anagrafici, i recapiti e le impostazioni dell'account utente.
          </p>
        </div>
        <a href="/app/users" class="m3-btn-outline">
          <i class="fa-solid fa-arrow-left text-xs"></i> Annulla e Torna Indietro
        </a>
      </div>

      <form id="edit_form" class="form row g-4">
        
        <!-- Avatar Preview -->
        <div class="col-12 flex justify-center mb-2">
          <img
            id="profile"
            alt="Foto Profilo"
            class="rounded-full w-28 h-28 object-cover border-2 border-purple-500/40 shadow-xl"
            style="display: none;"
          />
        </div>

        <!-- Dati Base -->
        <div class="col-md-4">
          <label for="name" class="form-label text-xs font-semibold text-gray-300">Nome *</label>
          <input type="text" class="form-control" id="name" required />
        </div>

        <div class="col-md-4">
          <label for="surname" class="form-label text-xs font-semibold text-gray-300">Cognome *</label>
          <input type="text" class="form-control" id="surname" required />
        </div>

        <div class="col-md-4">
          <label for="validationDefaultUsername" class="form-label text-xs font-semibold text-gray-300">Username *</label>
          <div class="input-group">
            <span class="input-group-text font-mono text-purple-300">@</span>
            <input type="text" class="form-control font-mono" id="validationDefaultUsername" required />
          </div>
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label text-xs font-semibold text-gray-300">Email *</label>
          <input type="email" class="form-control" id="email" required />
        </div>

        <div class="col-md-2">
          <label for="phone_prefix" class="form-label text-xs font-semibold text-gray-300">Prefisso</label>
          <input type="text" class="form-control font-mono" id="phone_prefix" placeholder="+39" />
        </div>

        <div class="col-md-4">
          <label for="phone" class="form-label text-xs font-semibold text-gray-300">Telefono</label>
          <input type="tel" class="form-control" id="phone" />
        </div>

        <!-- Dati Anagrafici -->
        <div class="col-md-3">
          <label for="birthdate" class="form-label text-xs font-semibold text-gray-300">Data di Nascita</label>
          <input type="date" class="form-control" id="birthdate" />
        </div>

        <div class="col-md-3">
          <label for="gender" class="form-label text-xs font-semibold text-gray-300">Genere</label>
          <select class="form-select" id="gender">
            <option value="" selected disabled>Seleziona...</option>
            <option value="M">Maschio (M)</option>
            <option value="F">Femmina (F)</option>
            <option value="OTHER">Altro</option>
          </select>
        </div>

        <div class="col-md-3">
          <label for="nationality" class="form-label text-xs font-semibold text-gray-300">Nazionalità</label>
          <input type="text" class="form-control" id="nationality" placeholder="Italiana" />
        </div>

        <div class="col-md-3">
          <label for="ssn" class="form-label text-xs font-semibold text-gray-300">Codice Fiscale / SSN</label>
          <input type="text" class="form-control font-mono" id="ssn" placeholder="RSSMRA..." />
        </div>

        <div class="col-md-6">
          <label for="occupation" class="form-label text-xs font-semibold text-gray-300">Occupazione</label>
          <input type="text" class="form-control" id="occupation" />
        </div>

        <div class="col-md-6">
          <label for="education" class="form-label text-xs font-semibold text-gray-300">Istruzione</label>
          <input type="text" class="form-control" id="education" />
        </div>

        <!-- Caricamento Foto -->
        <div class="col-12">
          <label for="file" class="form-label text-xs font-semibold text-gray-300">Carica Nuova Foto Profilo</label>
          <input type="file" class="form-control" id="file" accept="image/jpeg,image/png,image/webp" />
        </div>

        <!-- Attributi JSON -->
        <div class="col-12">
          <label for="attributes" class="form-label text-xs font-semibold text-gray-300">Attributi Custom (JSON)</label>
          <textarea class="form-control font-mono text-xs" id="attributes" rows="4" placeholder="{}"></textarea>
          <div id="validationAttributes" class="text-red-400 text-xs mt-1"></div>
        </div>

        <div class="col-12 flex items-center gap-2 pt-2">
          <input class="w-4 h-4 rounded accent-purple-500 cursor-pointer" type="checkbox" value="true" id="invalidCheck2" required checked />
          <label class="text-xs text-gray-300 cursor-pointer" for="invalidCheck2">
            Confermo la veridicità delle modifiche apportate
          </label>
        </div>

        <div class="col-12 pt-6 border-t border-purple-500/15 flex items-center justify-end gap-3">
          <a href="/app/users" class="m3-btn-outline">
            <i class="fa-solid fa-xmark"></i> Annulla
          </a>
          <button id="edit_user_button" class="m3-btn-primary" type="submit">
            <i class="fa-solid fa-check"></i> Salva Modifiche
          </button>
        </div>

      </form>
    </div>
  </main>

</body>
</html>
