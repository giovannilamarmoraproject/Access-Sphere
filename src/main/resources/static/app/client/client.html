    /* =======================================================
       CAMPO SECRET MASCHERATO (.masked-input)
       =======================================================
       Visualizza il valore del secret come pallini (●) quando type="password".
       - max-width limitato a 120px: mostra solo ~8 pallini, evitando la lunga
         fila di punti che occupava tutta la larghezza del container (Foto 1).
       - Il valore completo è comunque preservato nell'attributo value per la copia
         e per la rivelazione tramite toggleMask (toggle password ⇌ text).
       - overflow/text-overflow gestiscono il troncamento visivo.
       ======================================================= */
    .masked-input {
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-family: monospace;
      font-size: 0.8rem;
      outline: none;
      width: 100%;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Quando il campo è rivelato (type="text"), si espande al 100% per mostrare il valore intero */
    .masked-input[type="text"] {
      max-width: 100%;
    }

  <script>
    let currentClientData = null;

    function formatTimeMs(ms) {
      if (!ms && ms !== 0) return "N/D";
      const num = parseInt(ms);
      if (isNaN(num)) return ms;
      if (num >= 3600000) {
        const hours = (num / 3600000).toFixed(1).replace(".0", "");
        return `${num} ms (${hours} ${hours === "1" ? "ora" : "ore"})`;
      } else if (num >= 60000) {
        const mins = (num / 60000).toFixed(1).replace(".0", "");
        return `${num} ms (${mins} min)`;
      } else if (num >= 1000) {
        const secs = (num / 1000).toFixed(1).replace(".0", "");
        return `${num} ms (${secs} sec)`;
      }
      return `${num} ms`;
    }

    function parseScopesArray(scopes) {
      if (!scopes) return [];
      if (Array.isArray(scopes)) return scopes;
      if (typeof scopes === "string") {
        try {
          const parsed = JSON.parse(scopes);
          if (Array.isArray(parsed)) return parsed;
        } catch(e) {}
        return scopes.split(/[\s,]+/).filter(Boolean);
      }
      if (typeof scopes === "object") return Object.values(scopes).filter(Boolean);
      return [String(scopes)];
    }

    function extractUriList(val) {
      if (!val) return [];
      if (Array.isArray(val)) {
        return val.flatMap(item => extractUriList(item)).filter(Boolean);
      }
      if (typeof val === "object") {
        return Object.values(val).flatMap(item => extractUriList(item)).filter(Boolean);
      }
      if (typeof val === "string") {
        const trimmed = val.trim();
        if (trimmed.startsWith("[") || (trimmed.startsWith("{") && !trimmed.startsWith("{\"http"))) {
          try {
            return extractUriList(JSON.parse(trimmed));
          } catch (e) {}
        }
        return trimmed.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
      }
      return [String(val).trim()].filter(Boolean);
    }

    function parseRedirectMap(raw) {
      let res = { redirect_uris: [], fallback_uris: [] };
      if (!raw) return res;
      if (typeof raw === "object" && !Array.isArray(raw)) {
        res.redirect_uris = extractUriList(raw.redirect_uri || raw.redirect_uris || raw.redirectUri);
        res.fallback_uris = extractUriList(raw.fallback_uri || raw.fallback_uris || raw.fallbackUri);
        return res;
      }
      if (typeof raw === "string") {
        try {
          const parsed = JSON.parse(raw);
          if (typeof parsed === "object" && !Array.isArray(parsed)) {
            res.redirect_uris = extractUriList(parsed.redirect_uri || parsed.redirect_uris || parsed.redirectUri);
            res.fallback_uris = extractUriList(parsed.fallback_uri || parsed.fallback_uris || parsed.fallbackUri);
            return res;
          }
        } catch(e) {}
        res.redirect_uris = extractUriList(raw);
      }
      return res;
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadClientDetails();
    });

    window.addEventListener("languageChanged", () => {
      if (currentClientData) {
        renderClientDetail(currentClientData);
      }
    });

    function loadClientDetails() {
      const path = window.location.href;
      let clientId = null;
      if (path.includes("details/")) {
        clientId = decodeURIComponent(path.split("details/")[1].split("/")[0].split("?")[0].split("#")[0]);
      } else {
        clientId = new URLSearchParams(window.location.search).get("clientId") || new URLSearchParams(window.location.search).get("id");
      }

      if (!clientId) {
        document.getElementById("client-detail-container").innerHTML = `
          <div class="m3-card p-8 text-center text-red-300">
            <p class="font-bold mb-2">Client ID non specificato.</p>
            <a href="/app/clients" class="m3-btn-outline text-xs mt-2">${typeof t === 'function' ? t('client_detail_back', 'Torna ai Client') : 'Torna ai Client'}</a>
          </div>
        `;
        return;
      }

      const token = getCookieOrStorage(config.access_token);
      const url = window.location.origin + "/v1/clients";

      fetch(url, {
        headers: { "Authorization": "Bearer " + token }
      })
      .then(async (res) => {
        const data = await res.json();
        const clients = data.data || [];
        const client = clients.find(c => c.clientId === clientId);
        if (client) {
          currentClientData = client;
          renderClientDetail(client);
        } else {
          document.getElementById("client-detail-container").innerHTML = `
            <div class="m3-card p-8 text-center text-red-300">
              <p class="font-bold mb-2">${typeof t === 'function' ? t('client_detail_no_client_found', 'Nessun client trovato con ID:') : 'Nessun client trovato con ID:'} ${clientId}</p>
              <a href="/app/clients" class="m3-btn-outline text-xs mt-2">${typeof t === 'function' ? t('client_detail_back', 'Torna ai Client') : 'Torna ai Client'}</a>
            </div>
          `;
        }
      })
      .catch((err) => {
        console.error(err);
        document.getElementById("client-detail-container").innerHTML = `
          <div class="m3-card p-8 text-center text-red-300">
            <p class="font-bold mb-2">Errore di connessione durante il caricamento del client.</p>
            <a href="/app/clients" class="m3-btn-outline text-xs mt-2">${typeof t === 'function' ? t('client_detail_back', 'Torna ai Client') : 'Torna ai Client'}</a>
          </div>
        `;
      });
    }

    function renderClientDetail(c) {
      const container = document.getElementById("client-detail-container");

      const authType = c.authType || c.type || "ALL_TYPE";
      const tokenType = c.tokenType || "BEARER_JWT";
      const accessType = c.accessType || "ONLINE";
      const redirectStatus = c.authorize_redirect_status || "FOUND";

      const mfaEnabled = (c.mfaEnabled !== undefined) ? !!c.mfaEnabled : !!c.mfa_enabled;
      const idToken = (c.idToken !== undefined) ? !!c.idToken : !!c.id_token;
      const accessToken = (c.accessToken !== undefined) ? !!c.accessToken : !!c.access_token;
      const strapiToken = (c.strapiToken !== undefined) ? !!c.strapiToken : !!c.strapi_token;

      const scopesList = parseScopesArray(c.scopes);
      const redirectInfo = parseRedirectMap(c.redirect_uri);

      // Parse App Roles
      let roles = [];
      const rawRoles = c.appRoles || c.app_roles;
      if (rawRoles) {
        if (typeof rawRoles === "string") {
          try { roles = JSON.parse(rawRoles); } catch(e) {}
        } else if (Array.isArray(rawRoles)) {
          roles = rawRoles;
        }
      }

      // Parse Webhooks
      let webhooks = [];
      const rawWebhooks = c.webhooks;
      if (rawWebhooks) {
        if (typeof rawWebhooks === "string") {
          try { webhooks = JSON.parse(rawWebhooks); } catch(e) {}
        } else if (Array.isArray(rawWebhooks)) {
          webhooks = rawWebhooks;
        }
      }

      const activeLabel = typeof t === 'function' ? t('user_detail_active', 'ATTIVO') : 'ATTIVO';
      const inactiveLabel = typeof t === 'function' ? t('user_detail_disabled_f', 'DISATTIVO') : 'DISATTIVO';
      const yesLabel = typeof t === 'function' ? t('user_detail_yes', 'SI') : 'SI';
      const noLabel = typeof t === 'function' ? (t('no', 'NO') || 'NO') : 'NO';

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 w-full">
          
          <!-- COLONNA SINISTRA: SCHEDA PRINCIPALE & AZIONI RAPIDE -->
          <div class="space-y-6">
            <div class="m3-card p-8 flex flex-col items-center text-center">
              <div class="w-20 h-20 rounded-3xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center text-purple-300 text-3xl mb-5 shadow-xl">
                <i class="fa-solid fa-cube"></i>
              </div>

              <h3 class="text-2xl font-bold text-white mb-1 font-mono tracking-tight">${c.clientId || "N/D"}</h3>
              <p class="text-gray-400 text-xs font-mono mb-4 break-all">
                Ext ID: <span class="text-purple-300">${c.externalClientId || "Nessuno"}</span>
              </p>

              <div class="flex flex-wrap items-center justify-center gap-2 mb-6">
                <span class="pill-badge pill-info font-mono">${authType}</span>
                <span class="pill-badge pill-info font-mono">${tokenType}</span>
                ${mfaEnabled 
                  ? `<span class="pill-badge pill-active"><i class="fa-solid fa-shield-check"></i> ${typeof t === 'function' ? t('client_detail_mfa_active', 'MFA ATTIVA') : 'MFA ATTIVA'}</span>` 
                  : `<span class="pill-badge pill-inactive"><i class="fa-solid fa-shield-slash"></i> ${typeof t === 'function' ? t('client_detail_mfa_off', 'MFA OFF') : 'MFA OFF'}</span>`}
              </div>

              <!-- CREDENZIALI CRITICHE -->
              <div class="w-full space-y-3 mb-6 text-left">
                <!-- Client Secret -->
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_secret', 'Client Secret') : 'Client Secret'}</span>
                  ${c.clientSecret ? `
                  <div class="flex items-center gap-2">
                    <input type="password" id="secret-clientSecret" readonly value="${c.clientSecret}" class="masked-input text-xs" />
                    <button type="button" class="m3-icon-btn flex-shrink-0" onclick="toggleMask('secret-clientSecret', 'eye-clientSecret')" title="Mostra / Nascondi">
                      <i id="eye-clientSecret" class="fa-solid fa-eye text-xs"></i>
                    </button>
                    <button type="button" class="m3-icon-btn flex-shrink-0" onclick="copyValue('${c.clientSecret}', 'Client Secret')" title="Copia Secret">
                      <i class="fa-solid fa-copy text-xs"></i>
                    </button>
                  </div>
                  ` : '<div class="param-value font-mono text-sm font-semibold mt-1">N/D</div>'}
                </div>

                <!-- Registration Token -->
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_reg_token', 'Registration Token') : 'Registration Token'}</span>
                  ${(c.registrationToken || c.registration_token) ? `
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-xs text-gray-200 truncate flex-1">${c.registrationToken || c.registration_token}</span>
                    <button type="button" class="m3-icon-btn flex-shrink-0" onclick="copyValue('${c.registrationToken || c.registration_token}', 'Registration Token')" title="Copia Token">
                      <i class="fa-solid fa-copy text-xs"></i>
                    </button>
                  </div>
                  ` : '<div class="param-value font-mono text-sm font-semibold mt-1">N/D</div>'}
                </div>
              </div>

              <!-- BOTTONI AZIONE -->
              <div class="space-y-2.5 w-full">
                <a href="/app/clients/edit/${encodeURIComponent(c.clientId)}" class="m3-btn-primary w-full justify-center text-xs font-bold text-decoration-none flex items-center gap-2 shadow-lg">
                  <i class="fa-solid fa-pen-to-square"></i>
                  <span>${typeof t === 'function' ? t('client_detail_edit_all_btn', 'Modifica Tutte le Impostazioni') : 'Modifica Tutte le Impostazioni'}</span>
                </a>
                
                <button onclick="copyFullConfigJson()" class="m3-btn-outline w-full justify-center text-xs flex items-center gap-2">
                  <i class="fa-solid fa-code"></i>
                  <span>${typeof t === 'function' ? t('client_detail_copy_json_btn', 'Copia Configurazione JSON') : 'Copia Configurazione JSON'}</span>
                </button>

                <button onclick="deleteClientAction('${c.clientId}')" class="w-full text-xs font-semibold cursor-pointer flex items-center justify-center gap-2 transition-all mt-2" style="border-radius: 9999px !important; color: #FFFFFF !important; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); padding: 10px 18px;">
                  <i class="fa-solid fa-trash text-xs" style="color: #F87171;"></i>
                  <span>${typeof t === 'function' ? t('client_detail_delete_btn', 'Elimina Client OAuth2') : 'Elimina Client OAuth2'}</span>
                </button>
              </div>
            </div>

            <!-- FLAG DI EMISSIONE & PROTOCOLLI -->
            <div class="m3-card p-6">
              <div class="detail-card-title m-0 pb-3 mb-4">
                <i class="fa-solid fa-toggle-on text-purple-400"></i> ${typeof t === 'function' ? t('client_detail_issuance_title', 'Flag di Emissione & Requisiti') : 'Flag di Emissione & Requisiti'}
              </div>
              <div class="space-y-3">
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-purple-500/5 border border-purple-500/10">
                  <div>
                    <span class="text-xs font-bold text-white block">${typeof t === 'function' ? t('client_flag_mfa', 'MFA Obbligatoria') : 'MFA Obbligatoria'}</span>
                    <span class="text-[10px] text-gray-400 font-mono">mfa_enabled</span>
                  </div>
                  <span class="pill-badge ${mfaEnabled ? 'pill-active' : 'pill-inactive'}">${mfaEnabled ? yesLabel : noLabel}</span>
                </div>

                <div class="flex items-center justify-between p-2.5 rounded-xl bg-purple-500/5 border border-purple-500/10">
                  <div>
                    <span class="text-xs font-bold text-white block">${typeof t === 'function' ? t('client_flag_id_token', 'Emissione ID Token') : 'Emissione ID Token'}</span>
                    <span class="text-[10px] text-gray-400 font-mono">id_token (OIDC)</span>
                  </div>
                  <span class="pill-badge ${idToken ? 'pill-active' : 'pill-inactive'}">${idToken ? activeLabel : inactiveLabel}</span>
                </div>

                <div class="flex items-center justify-between p-2.5 rounded-xl bg-purple-500/5 border border-purple-500/10">
                  <div>
                    <span class="text-xs font-bold text-white block">${typeof t === 'function' ? t('client_flag_access_token', 'Emissione Access Token') : 'Emissione Access Token'}</span>
                    <span class="text-[10px] text-gray-400 font-mono">access_token (OAuth2)</span>
                  </div>
                  <span class="pill-badge ${accessToken ? 'pill-active' : 'pill-inactive'}">${accessToken ? activeLabel : inactiveLabel}</span>
                </div>

                <div class="flex items-center justify-between p-2.5 rounded-xl bg-purple-500/5 border border-purple-500/10">
                  <div>
                    <span class="text-xs font-bold text-white block">${typeof t === 'function' ? t('client_flag_strapi_token', 'Emissione Strapi Token') : 'Emissione Strapi Token'}</span>
                    <span class="text-[10px] text-gray-400 font-mono">strapi_token</span>
                  </div>
                  <span class="pill-badge ${strapiToken ? 'pill-active' : 'pill-inactive'}">${strapiToken ? activeLabel : inactiveLabel}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- COLONNA DESTRA: SPECIFICHE DETTAGLIATE, RUOLI & WEBHOOKS -->
          <div class="lg:col-span-2 space-y-6">
            
            <!-- SCHEDA PROTOCOLLO & RETE -->
            <div class="m3-card p-6 sm:p-8">
              <div class="detail-card-title">
                <i class="fa-solid fa-network-wired text-purple-400"></i> ${typeof t === 'function' ? t('client_detail_oauth_params_title', 'Parametri OAuth2 & Endpoint di Rete') : 'Parametri OAuth2 & Endpoint di Rete'}
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_access_type', 'Access Type') : 'Access Type'}</span>
                  <div class="param-value font-mono font-semibold">${accessType}</div>
                </div>
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_redirect_status', 'Authorize Status') : 'Authorize Status'}</span>
                  <div class="param-value font-mono font-semibold">${redirectStatus}</div>
                </div>
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_token_type', 'Token Type') : 'Token Type'}</span>
                  <div class="param-value font-mono font-semibold">${tokenType}</div>
                </div>
              </div>

              <!-- SCOPES -->
              <div class="param-box mb-4">
                <span class="param-label">${typeof t === 'function' ? t('client_field_scopes', 'Scopes Autorizzati') : 'Scopes Autorizzati'}</span>
                <div class="flex flex-wrap gap-1.5 mt-1">
                  ${scopesList.length > 0 
                    ? scopesList.map(s => `<span class="px-2.5 py-1 rounded-lg bg-purple-500/15 border border-purple-500/25 text-purple-300 font-mono text-xs">${s}</span>`).join('') 
                    : `<span class="text-gray-400 text-xs italic">${typeof t === 'function' ? t('client_detail_no_scopes', 'Nessuno scope specificato') : 'Nessuno scope specificato'}</span>`}
                </div>
              </div>

              <!-- REDIRECT URIS -->
              <div class="param-box mb-4">
                <div class="flex items-center justify-between mb-2">
                  <span class="param-label m-0">${typeof t === 'function' ? t('client_field_redirect_uris', 'Redirect URIs Autorizzate (redirect_uri)') : 'Redirect URIs Autorizzate (redirect_uri)'}</span>
                  ${redirectInfo.redirect_uris.length > 0 ? `<span class="text-[11px] font-mono text-purple-300 font-semibold">${redirectInfo.redirect_uris.length} ${typeof t === 'function' ? t('client_detail_configured_uris', 'URI configurate') : 'URI configurate'}</span>` : ''}
                </div>
                ${redirectInfo.redirect_uris.length > 0 ? `
                  <div class="flex flex-col gap-2 mt-2">
                    ${redirectInfo.redirect_uris.map(u => `
                      <div class="flex items-center justify-between gap-3 p-2.5 rounded-xl m3-uri-badge transition-all group">
                        <div class="flex items-center gap-2.5 min-w-0 flex-1">
                          <i class="fa-solid fa-link text-xs shrink-0"></i>
                          <span class="font-mono text-xs break-all select-all">${u}</span>
                        </div>
                        <button type="button" class="m3-icon-btn flex-shrink-0 opacity-80 group-hover:opacity-100" onclick="copyValue('${u}', 'Redirect URI')" title="Copia URI">
                          <i class="fa-solid fa-copy text-[11px]"></i>
                        </button>
                      </div>
                    `).join('')}
                  </div>
                ` : `<div class="text-gray-400 text-xs italic py-1">${typeof t === 'function' ? t('client_detail_no_redirect_uris', 'Nessuna redirect URI configurata') : 'Nessuna redirect URI configurata'}</div>`}
              </div>

              <!-- FALLBACK URI -->
              <div class="param-box">
                <div class="flex items-center justify-between mb-2">
                  <span class="param-label m-0">${typeof t === 'function' ? t('client_field_fallback_uri', 'Fallback URI (fallback_uri)') : 'Fallback URI (fallback_uri)'}</span>
                  ${redirectInfo.fallback_uris.length > 0 ? `<span class="text-[11px] font-mono text-purple-300 font-semibold">${redirectInfo.fallback_uris.length} ${typeof t === 'function' ? t('client_detail_configured_uris', 'URI configurate') : 'URI configurate'}</span>` : ''}
                </div>
                ${redirectInfo.fallback_uris.length > 0 ? `
                  <div class="flex flex-col gap-2 mt-2">
                    ${redirectInfo.fallback_uris.map(u => `
                      <div class="flex items-center justify-between gap-3 p-2.5 rounded-xl bg-purple-950/40 border border-purple-500/20 hover:border-purple-400/40 transition-all group">
                        <div class="flex items-center gap-2.5 min-w-0 flex-1">
                          <i class="fa-solid fa-arrow-turn-down text-purple-400 text-xs shrink-0"></i>
                          <span class="font-mono text-xs text-purple-200 break-all select-all">${u}</span>
                        </div>
                        <button type="button" class="m3-icon-btn flex-shrink-0 opacity-80 group-hover:opacity-100" onclick="copyValue('${u}', 'Fallback URI')" title="Copia URI">
                          <i class="fa-solid fa-copy text-[11px]"></i>
                        </button>
                      </div>
                    `).join('')}
                  </div>
                ` : `<div class="text-gray-400 text-xs italic py-1">${typeof t === 'function' ? t('client_detail_no_fallback_uri', 'Nessuna fallback URI configurata') : 'Nessuna fallback URI configurata'}</div>`}
              </div>
            </div>

            <!-- SCHEDA CRITTOGRAFIA & CHIAVI -->
            <div class="m3-card p-6 sm:p-8">
              <div class="detail-card-title">
                <i class="fa-solid fa-shield-halved text-purple-400"></i> ${typeof t === 'function' ? t('client_detail_crypto_title', 'Parametri Crittografici & Scadenze Token') : 'Parametri Crittografici & Scadenze Token'}
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- JWT Secret -->
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_jwt_secret', 'JWT Secret Key (256-bit)') : 'JWT Secret Key (256-bit)'}</span>
                  ${(c.jwtSecret || c.jwt_secret) ? `
                  <div class="flex items-center gap-2 mt-1">
                    <input type="password" id="secret-jwtSecret" readonly value="${c.jwtSecret || c.jwt_secret}" class="masked-input text-xs" />
                    <button type="button" class="m3-icon-btn flex-shrink-0" onclick="toggleMask('secret-jwtSecret', 'eye-jwtSecret')" title="Mostra / Nascondi">
                      <i id="eye-jwtSecret" class="fa-solid fa-eye text-xs"></i>
                    </button>
                    <button type="button" class="m3-icon-btn flex-shrink-0" onclick="copyValue('${c.jwtSecret || c.jwt_secret}', 'JWT Secret')" title="Copia">
                      <i class="fa-solid fa-copy text-xs"></i>
                    </button>
                  </div>
                  ` : '<div class="param-value font-mono text-sm font-semibold mt-1">N/D</div>'}
                </div>

                <!-- JWT Expiration -->
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_jwt_exp', 'Scadenza JWT (jwtExpiration)') : 'Scadenza JWT (jwtExpiration)'}</span>
                  <div class="param-value font-mono text-sm font-semibold mt-1">
                    ${formatTimeMs(c.jwtExpiration || c.jwt_expiration)}
                  </div>
                </div>

                <!-- JWE Secret -->
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_jwe_secret', 'JWE Secret Key (Cifratura)') : 'JWE Secret Key (Cifratura)'}</span>
                  ${(c.jweSecret || c.jwe_secret) ? `
                  <div class="flex items-center gap-2 mt-1">
                    <input type="password" id="secret-jweSecret" readonly value="${c.jweSecret || c.jwe_secret}" class="masked-input text-xs" />
                    <button type="button" class="m3-icon-btn flex-shrink-0" onclick="toggleMask('secret-jweSecret', 'eye-jweSecret')" title="Mostra / Nascondi">
                      <i id="eye-jweSecret" class="fa-solid fa-eye text-xs"></i>
                    </button>
                    <button type="button" class="m3-icon-btn flex-shrink-0" onclick="copyValue('${c.jweSecret || c.jwe_secret}', 'JWE Secret')" title="Copia">
                      <i class="fa-solid fa-copy text-xs"></i>
                    </button>
                  </div>
                  ` : '<div class="param-value font-mono text-sm font-semibold mt-1">N/D</div>'}
                </div>

                <!-- JWE Expiration -->
                <div class="param-box">
                  <span class="param-label">${typeof t === 'function' ? t('client_field_jwe_exp', 'Scadenza JWE (jweExpiration)') : 'Scadenza JWE (jweExpiration)'}</span>
                  <div class="param-value font-mono text-sm font-semibold mt-1">
                    ${formatTimeMs(c.jweExpiration || c.jwe_expiration)}
                  </div>
                </div>
              </div>
            </div>

            <!-- SCHEDA RUOLI APPLICATIVI (app_roles) -->
            <div class="m3-card p-6 sm:p-8">
              <div class="detail-card-title flex items-center justify-between">
                <span><i class="fa-solid fa-user-shield text-purple-400"></i> ${typeof t === 'function' ? t('client_detail_app_roles_title', 'Ruoli Applicativi Configurati') : 'Ruoli Applicativi Configurati'} (${roles.length})</span>
                <span class="text-xs text-purple-300 font-mono">app_roles</span>
              </div>
              <div class="overflow-x-auto">
                <table class="table repeater-table w-full text-xs">
                  <thead>
                    <tr>
                      <th style="width: 25%;">${typeof t === 'function' ? t('client_table_col_role', 'Ruolo') : 'Ruolo'}</th>
                      <th style="width: 20%;">${typeof t === 'function' ? t('client_table_col_type', 'Tipo') : 'Tipo'}</th>
                      <th style="width: 55%;">${typeof t === 'function' ? t('client_table_col_desc', 'Descrizione') : 'Descrizione'}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${roles.length > 0 ? roles.map(r => `
                      <tr>
                        <td class="font-mono font-bold text-white">${r.role || ''}</td>
                        <td><span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/30">${r.type || 'DEFAULT'}</span></td>
                        <td class="role-desc-text">${r.description || 'Nessuna descrizione fornita'}</td>
                      </tr>
                    `).join('') : `<tr><td colspan="3" class="repeater-empty-state">${typeof t === 'function' ? t('client_detail_empty_roles', 'Nessun ruolo configurato. Clicca su "Aggiungi Ruolo" per aggiungerne uno.') : 'Nessun ruolo configurato. Clicca su "Aggiungi Ruolo" per aggiungerne uno.'}</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- SCHEDA WEBHOOKS -->
            <div class="m3-card p-6 sm:p-8">
              <div class="detail-card-title flex items-center justify-between">
                <span><i class="fa-solid fa-satellite-dish text-purple-400"></i> ${typeof t === 'function' ? t('client_detail_webhooks_title', 'Webhooks Registrati') : 'Webhooks Registrati'} (${webhooks.length})</span>
                <span class="text-xs text-purple-300 font-mono">webhooks</span>
              </div>
              <div class="overflow-x-auto">
                <table class="table repeater-table w-full text-xs">
                  <thead>
                    <tr>
                      <th style="width: 25%;">${typeof t === 'function' ? t('client_table_col_webhook_name', 'Nome') : 'Nome'}</th>
                      <th style="width: 55%;">${typeof t === 'function' ? t('client_table_col_webhook_url', 'URL Endpoint') : 'URL Endpoint'}</th>
                      <th style="width: 20%;">${typeof t === 'function' ? t('client_table_col_webhook_action', 'Azione') : 'Azione'}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${webhooks.length > 0 ? webhooks.map(w => `
                      <tr>
                        <td class="font-bold text-white">${w.name || 'Webhook'}</td>
                        <td class="font-mono text-purple-300 break-all">${w.url || ''}</td>
                        <td><span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">${w.action || 'DELETE_USER'}</span></td>
                      </tr>
                    `).join('') : `<tr><td colspan="3" class="repeater-empty-state">${typeof t === 'function' ? t('client_detail_empty_webhooks', 'Nessun webhook registrato per questo client.') : 'Nessun webhook registrato per questo client.'}</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>

          </div>

        </div>
      `;
    }

    function toggleMask(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (input.type === "password") {
        input.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
      }
    }

    function copyValue(val, label) {
      if (!val) {
        sweetalert("warning", (typeof t === 'function' ? t('swal_missing_data_title', 'Dato Assente') : 'Dato Assente'), `${label} ` + (typeof t === 'function' ? t('swal_missing_data_desc', 'non è configurato.') : 'non è configurato.'));
        return;
      }
      navigator.clipboard.writeText(val).then(() => {
        sweetalert("info", (typeof t === 'function' ? t('swal_copied_title', 'Copiato!') : 'Copiato!'), `${label} ` + (typeof t === 'function' ? t('swal_copied_desc', 'copiato negli appunti.') : 'copiato negli appunti.'));
      });
    }

    window.addEventListener("languageChanged", () => {
      if (currentClientData) {
        renderClientDetail(currentClientData);
      }
    });

    function copyFullConfigJson() {
      if (!currentClientData) return;
      const jsonStr = JSON.stringify(currentClientData, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        sweetalert("success", (typeof t === 'function' ? t("swal_json_copied_title", "JSON Copiato!") : "JSON Copiato!"), (typeof t === 'function' ? t("swal_json_copied_desc", "La configurazione completa del client è stata copiata negli appunti in formato JSON.") : "La configurazione completa del client è stata copiata negli appunti in formato JSON."));
      });
    }

    function deleteClientAction(clientId) {
      Swal.fire({
        title: (typeof t === 'function' ? t("swal_delete_client_title", "Sei sicuro?") : "Sei sicuro?"),
        text: (typeof t === 'function' ? t("swal_delete_client_desc", `Vuoi davvero eliminare il client ${clientId}? L'operazione è irreversibile!`).replace("#CLIENT_ID#", clientId) : `Vuoi davvero eliminare il client ${clientId}? L'operazione è irreversibile!`),
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: (typeof t === 'function' ? t("btn_delete_confirm", "Sì, elimina!") : "Sì, elimina!"),
        cancelButtonText: (typeof t === 'function' ? t("btn_cancel", "Annulla") : "Annulla")
      }).then((result) => {
        if (result.isConfirmed) {
          const token = getCookieOrStorage(config.access_token);
          const url = window.location.origin + `/v1/client/${encodeURIComponent(clientId)}`;

          fetch(url, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
          }).then(async (res) => {
            if (res.ok) {
              sweetalert("success", (typeof t === 'function' ? t("swal_deleted_title", "Eliminato") : "Eliminato"), (typeof t === 'function' ? t("swal_delete_client_success", `Il client ${clientId} è stato rimosso.`).replace("#CLIENT_ID#", clientId) : `Il client ${clientId} è stato rimosso.`));
              setTimeout(() => {
                window.location.href = "/app/clients";
              }, 1500);
            } else {
              sweetalert("error", (typeof t === 'function' ? t("swal_error_title", "Errore") : "Errore"), (typeof t === 'function' ? t("swal_delete_client_error", "Impossibile eliminare il client.") : "Impossibile eliminare il client."));
            }
          });
        }
      });
    }
  </script>

</body>
</html>
